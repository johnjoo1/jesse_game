<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Paintball Wars</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #1d2b1f; font-family: system-ui, sans-serif; }
  canvas { display: block; cursor: crosshair; }
  #menu {
    position: fixed; inset: 0; display: flex; align-items: center; justify-content: center;
    background: rgba(10, 20, 12, 0.75);
  }
  #menu .card {
    background: #fff; border-radius: 16px; padding: 28px 32px; width: min(360px, 90vw);
    text-align: center; box-shadow: 0 10px 40px rgba(0,0,0,.4);
  }
  #menu h1 { margin: 0 0 6px; font-size: 32px; }
  #menu p { margin: 0 0 18px; color: #555; font-size: 14px; }
  #menu input {
    width: 100%; box-sizing: border-box; font-size: 18px; padding: 10px 12px;
    border: 2px solid #ccc; border-radius: 10px; margin-bottom: 14px;
  }
  #colors { display: flex; gap: 8px; justify-content: center; margin-bottom: 18px; flex-wrap: wrap; }
  #colors button {
    width: 32px; height: 32px; border-radius: 50%; border: 3px solid transparent; cursor: pointer;
  }
  #colors button.sel { border-color: #222; }
  #play {
    width: 100%; font-size: 20px; font-weight: 700; padding: 12px; border: 0; border-radius: 10px;
    background: #ff3d7f; color: #fff; cursor: pointer;
  }
  #menu .keys { margin-top: 16px; font-size: 13px; color: #666; line-height: 1.6; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="menu">
  <div class="card">
    <h1>Paintball Wars</h1>
    <p>Splat everyone. Don't get splatted.</p>
    <input id="name" maxlength="14" placeholder="Your name" value="">
    <div id="colors"></div>
    <button id="play">PLAY</button>
    <div class="keys">
      <b>WASD</b> move &nbsp;·&nbsp; <b>Mouse</b> aim &nbsp;·&nbsp; <b>Click</b> shoot<br>
      <b>R</b> reload &nbsp;·&nbsp; <b>Shift</b> sprint
    </div>
  </div>
</div>
<script>
(() => {
  // ---------- Config ----------
  const WORLD = 2400;
  const PLAYER_R = 20;
  const PLAYER_SPEED = 230;
  const SPRINT_MULT = 1.5;
  const STAMINA_MAX = 2;          // seconds of sprint
  const MAX_HP = 3;               // hits to splat
  const MAG_SIZE = 12;
  const FIRE_DELAY = 0.16;
  const RELOAD_TIME = 1.4;
  const BALL_SPEED = 950;
  const BALL_LIFE = 0.75;
  const BALL_R = 5;
  const SPREAD = 0.05;
  const RESPAWN_TIME = 3;
  const SPAWN_SHIELD = 2;
  const NUM_BOTS = 9;
  const COLORS = ['#ff3d7f', '#3da5ff', '#ffd23d', '#3dff8b', '#b03dff', '#ff8a3d', '#3dfff0', '#ff3d3d', '#9cff3d', '#ffffff'];
  const BOT_NAMES = ['Splatty', 'Blobby', 'Drip', 'Smudge', 'Neon', 'Goober', 'Pellet', 'Squish', 'Rainbow', 'Sploosh', 'Zippy', 'Mango'];

  const canvas = document.getElementById('c');
  const ctx = canvas.getContext('2d');
  let W = 0, H = 0, DPR = 1;
  function resize() {
    DPR = window.devicePixelRatio || 1;
    W = window.innerWidth; H = window.innerHeight;
    canvas.width = W * DPR; canvas.height = H * DPR;
    canvas.style.width = W + 'px'; canvas.style.height = H + 'px';
  }
  window.addEventListener('resize', resize);
  resize();

  // ---------- Helpers ----------
  const rand = (a, b) => a + Math.random() * (b - a);
  const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
  const dist2 = (ax, ay, bx, by) => (ax - bx) ** 2 + (ay - by) ** 2;

  // ---------- Paint layer (persistent splats on the ground) ----------
  const PAINT_SCALE = 0.5;
  const paint = document.createElement('canvas');
  paint.width = WORLD * PAINT_SCALE; paint.height = WORLD * PAINT_SCALE;
  const pctx = paint.getContext('2d');

  function splat(x, y, color, size) {
    pctx.save();
    pctx.scale(PAINT_SCALE, PAINT_SCALE);
    pctx.fillStyle = color;
    pctx.globalAlpha = 0.85;
    pctx.beginPath();
    pctx.arc(x, y, size, 0, Math.PI * 2);
    pctx.fill();
    const drops = 5 + (size / 3) | 0;
    for (let i = 0; i < drops; i++) {
      const a = Math.random() * Math.PI * 2;
      const d = size * rand(0.8, 2.2);
      pctx.beginPath();
      pctx.arc(x + Math.cos(a) * d, y + Math.sin(a) * d, size * rand(0.12, 0.35), 0, Math.PI * 2);
      pctx.fill();
    }
    pctx.restore();
  }

  // ---------- Obstacles ----------
  // rects: walls / crates (block movement + paintballs)
  // circles: rocks (block movement + paintballs)
  // bushes: you can hide inside (block nothing, but hide you from bots)
  let rects = [], rocks = [], bushes = [];

  function buildMap() {
    rects = []; rocks = []; bushes = [];
    const t = 24;
    // Long walls
    for (let i = 0; i < 14; i++) {
      const horiz = Math.random() < 0.5;
      const len = rand(180, 420);
      const x = rand(100, WORLD - 100 - len), y = rand(100, WORLD - 100 - len);
      rects.push(horiz ? { x, y, w: len, h: t, kind: 'wall' } : { x, y, w: t, h: len, kind: 'wall' });
    }
    // L-shaped bunkers
    for (let i = 0; i < 6; i++) {
      const x = rand(200, WORLD - 400), y = rand(200, WORLD - 400);
      const a = rand(140, 220), b = rand(140, 220);
      rects.push({ x, y, w: a, h: t, kind: 'wall' });
      rects.push({ x, y, w: t, h: b, kind: 'wall' });
    }
    // Crates
    for (let i = 0; i < 22; i++) {
      const s = rand(44, 70);
      rects.push({ x: rand(80, WORLD - 80 - s), y: rand(80, WORLD - 80 - s), w: s, h: s, kind: 'crate' });
    }
    // Rocks
    for (let i = 0; i < 18; i++) {
      rocks.push({ x: rand(80, WORLD - 80), y: rand(80, WORLD - 80), r: rand(26, 48) });
    }
    // Bushes
    for (let i = 0; i < 14; i++) {
      bushes.push({ x: rand(80, WORLD - 80), y: rand(80, WORLD - 80), r: rand(45, 70) });
    }
  }

  function circleRectPush(c, r) {
    const cx = clamp(c.x, r.x, r.x + r.w), cy = clamp(c.y, r.y, r.y + r.h);
    const dx = c.x - cx, dy = c.y - cy;
    const d2 = dx * dx + dy * dy;
    if (d2 >= PLAYER_R * PLAYER_R) return false;
    if (d2 === 0) {
      // Center inside rect: push out along smallest axis
      const l = c.x - r.x, rr = r.x + r.w - c.x, tp = c.y - r.y, b = r.y + r.h - c.y;
      const m = Math.min(l, rr, tp, b);
      if (m === l) c.x = r.x - PLAYER_R; else if (m === rr) c.x = r.x + r.w + PLAYER_R;
      else if (m === tp) c.y = r.y - PLAYER_R; else c.y = r.y + r.h + PLAYER_R;
      return true;
    }
    const d = Math.sqrt(d2);
    c.x = cx + dx / d * PLAYER_R; c.y = cy + dy / d * PLAYER_R;
    return true;
  }

  function circleCirclePush(c, o) {
    const dx = c.x - o.x, dy = c.y - o.y, min = PLAYER_R + o.r;
    const d2 = dx * dx + dy * dy;
    if (d2 >= min * min || d2 === 0) return false;
    const d = Math.sqrt(d2);
    c.x = o.x + dx / d * min; c.y = o.y + dy / d * min;
    return true;
  }

  function resolveCollisions(p) {
    let hit = false;
    for (const r of rects) hit = circleRectPush(p, r) || hit;
    for (const o of rocks) hit = circleCirclePush(p, o) || hit;
    p.x = clamp(p.x, PLAYER_R, WORLD - PLAYER_R);
    p.y = clamp(p.y, PLAYER_R, WORLD - PLAYER_R);
    return hit;
  }

  function pointBlocked(x, y, pad = 0) {
    for (const r of rects) if (x > r.x - pad && x < r.x + r.w + pad && y > r.y - pad && y < r.y + r.h + pad) return true;
    for (const o of rocks) if (dist2(x, y, o.x, o.y) < (o.r + pad) ** 2) return true;
    return false;
  }

  function segRect(x1, y1, x2, y2, r) {
    // Liang–Barsky
    let t0 = 0, t1 = 1;
    const dx = x2 - x1, dy = y2 - y1;
    const p = [-dx, dx, -dy, dy], q = [x1 - r.x, r.x + r.w - x1, y1 - r.y, r.y + r.h - y1];
    for (let i = 0; i < 4; i++) {
      if (p[i] === 0) { if (q[i] < 0) return false; }
      else {
        const t = q[i] / p[i];
        if (p[i] < 0) { if (t > t1) return false; if (t > t0) t0 = t; }
        else { if (t < t0) return false; if (t < t1) t1 = t; }
      }
    }
    return true;
  }
  function segCircle(x1, y1, x2, y2, cx, cy, r) {
    const dx = x2 - x1, dy = y2 - y1;
    const l2 = dx * dx + dy * dy || 1;
    const t = clamp(((cx - x1) * dx + (cy - y1) * dy) / l2, 0, 1);
    return dist2(x1 + dx * t, y1 + dy * t, cx, cy) < r * r;
  }
  function lineOfSight(x1, y1, x2, y2) {
    for (const r of rects) if (segRect(x1, y1, x2, y2, r)) return false;
    for (const o of rocks) if (segCircle(x1, y1, x2, y2, o.x, o.y, o.r)) return false;
    return true;
  }
  function inBush(p) {
    for (const b of bushes) if (dist2(p.x, p.y, b.x, b.y) < (b.r - 6) ** 2) return true;
    return false;
  }

  function freeSpot() {
    for (let tries = 0; tries < 200; tries++) {
      const x = rand(60, WORLD - 60), y = rand(60, WORLD - 60);
      if (pointBlocked(x, y, PLAYER_R + 10)) continue;
      // Avoid spawning right next to an enemy
      if (players.some(p => p.alive && dist2(x, y, p.x, p.y) < 350 * 350)) continue;
      return { x, y };
    }
    return { x: WORLD / 2, y: WORLD / 2 };
  }

  // ---------- Entities ----------
  let players = [];
  let balls = [];
  let particles = [];
  let feed = [];
  let me = null;

  function makePlayer(name, color, isBot) {
    return {
      name, color, isBot,
      x: 0, y: 0, vx: 0, vy: 0, aim: 0,
      hp: MAX_HP, ammo: MAG_SIZE, reload: 0, cooldown: 0,
      stamina: STAMINA_MAX,
      alive: false, respawn: 0, shield: 0, hitFlash: 0,
      kills: 0, deaths: 0, streak: 0,
      // bot brain
      wanderA: Math.random() * Math.PI * 2, thinkT: 0, target: null, strafe: 1, reactT: 0,
    };
  }

  function spawn(p) {
    const s = freeSpot();
    p.x = s.x; p.y = s.y;
    p.hp = MAX_HP; p.ammo = MAG_SIZE; p.reload = 0; p.cooldown = 0.3;
    p.stamina = STAMINA_MAX;
    p.alive = true; p.shield = SPAWN_SHIELD; p.target = null;
  }

  function shoot(p) {
    if (!p.alive || p.reload > 0 || p.cooldown > 0) return;
    if (p.ammo <= 0) { startReload(p); return; }
    p.ammo--; p.cooldown = FIRE_DELAY;
    p.shield = 0; // shooting drops spawn shield
    const a = p.aim + rand(-SPREAD, SPREAD);
    const sx = p.x + Math.cos(a) * (PLAYER_R + 8), sy = p.y + Math.sin(a) * (PLAYER_R + 8);
    if (!lineOfSight(p.x, p.y, sx, sy)) { splat(sx, sy, p.color, 7); return; }
    balls.push({ x: sx, y: sy, vx: Math.cos(a) * BALL_SPEED, vy: Math.sin(a) * BALL_SPEED, life: BALL_LIFE, owner: p, color: p.color });
    if (p.ammo === 0) startReload(p);
  }
  function startReload(p) {
    if (p.reload > 0 || p.ammo === MAG_SIZE) return;
    p.reload = RELOAD_TIME;
  }

  function burst(x, y, color, n, speed) {
    for (let i = 0; i < n; i++) {
      const a = Math.random() * Math.PI * 2, s = rand(speed * 0.3, speed);
      particles.push({ x, y, vx: Math.cos(a) * s, vy: Math.sin(a) * s, life: rand(0.25, 0.5), color, r: rand(2, 5) });
    }
  }

  function hitPlayer(victim, ball) {
    if (victim.shield > 0) { burst(ball.x, ball.y, '#ffffff', 6, 120); return; }
    victim.hp--;
    victim.hitFlash = 0.15;
    burst(ball.x, ball.y, ball.color, 10, 200);
    splat(victim.x + rand(-10, 10), victim.y + rand(-10, 10), ball.color, 9);
    if (victim.hp <= 0) kill(victim, ball.owner);
  }

  function kill(victim, killer) {
    victim.alive = false;
    victim.respawn = RESPAWN_TIME;
    victim.deaths++;
    victim.streak = 0;
    splat(victim.x, victim.y, killer.color, 34);
    splat(victim.x, victim.y, victim.color, 14);
    burst(victim.x, victim.y, killer.color, 40, 380);
    killer.kills++;
    killer.streak++;
    let msg = `${killer.name} splatted ${victim.name}`;
    if (killer.streak === 3) msg += ' — ON FIRE! 🔥';
    if (killer.streak === 5) msg += ' — UNSTOPPABLE!';
    feed.unshift({ msg, t: 5, mine: killer === me || victim === me });
    if (feed.length > 5) feed.pop();
  }

  // ---------- Input ----------
  const keys = {};
  let mouseX = 0, mouseY = 0, mouseDown = false;
  window.addEventListener('keydown', e => {
    keys[e.code] = true;
    if (e.code === 'KeyR' && me && me.alive) startReload(me);
  });
  window.addEventListener('keyup', e => { keys[e.code] = false; });
  canvas.addEventListener('mousemove', e => { mouseX = e.clientX; mouseY = e.clientY; });
  canvas.addEventListener('mousedown', e => { if (e.button === 0) mouseDown = true; });
  window.addEventListener('mouseup', e => { if (e.button === 0) mouseDown = false; });
  window.addEventListener('blur', () => { for (const k in keys) keys[k] = false; mouseDown = false; });

  // ---------- Bot AI ----------
  function botThink(b, dt) {
    b.thinkT -= dt;
    if (b.thinkT <= 0) {
      b.thinkT = rand(0.25, 0.5);
      // Pick nearest visible enemy (bushes hide you unless very close)
      let best = null, bestD = 650 * 650;
      for (const o of players) {
        if (o === b || !o.alive) continue;
        const d = dist2(b.x, b.y, o.x, o.y);
        if (d > bestD) continue;
        if (inBush(o) && d > 110 * 110) continue;
        if (!lineOfSight(b.x, b.y, o.x, o.y)) continue;
        best = o; bestD = d;
      }
      if (best && best !== b.target) b.reactT = rand(0.2, 0.45); // reaction delay on new target
      b.target = best;
      if (Math.random() < 0.3) b.strafe *= -1;
      if (!best) b.wanderA += rand(-0.8, 0.8);
    }

    let mx = 0, my = 0;
    const t = b.target;
    if (t && t.alive) {
      const dx = t.x - b.x, dy = t.y - b.y, d = Math.hypot(dx, dy) || 1;
      // Lead the target a little, with imperfect aim
      const lead = d / BALL_SPEED * 0.6;
      const aimTo = Math.atan2(t.y + t.vy * lead - b.y, t.x + t.vx * lead - b.x);
      b.aim = aimTo + rand(-0.12, 0.12);
      const ux = dx / d, uy = dy / d;
      // Keep medium range, strafe sideways
      const pref = 300;
      const radial = d > pref + 60 ? 1 : d < pref - 60 ? -1 : 0;
      mx = ux * radial + -uy * b.strafe * 0.9;
      my = uy * radial + ux * b.strafe * 0.9;
      if (b.hp === 1 && b.ammo < 3) { mx = -ux; my = -uy; } // retreat when weak
      b.reactT -= dt;
      if (b.reactT <= 0 && b.reload <= 0 && Math.random() < 0.35) shoot(b);
    } else {
      mx = Math.cos(b.wanderA); my = Math.sin(b.wanderA);
      b.aim = b.wanderA;
      if (b.ammo < MAG_SIZE) startReload(b);
      // Drift toward the middle when near the edges
      if (b.x < 150 || b.x > WORLD - 150 || b.y < 150 || b.y > WORLD - 150)
        b.wanderA = Math.atan2(WORLD / 2 - b.y, WORLD / 2 - b.x);
    }
    const ml = Math.hypot(mx, my) || 1;
    return { mx: mx / ml, my: my / ml, sprint: !!t && b.hp === 1 };
  }

  // ---------- Update ----------
  function movePlayer(p, mx, my, sprint, dt) {
    let speed = PLAYER_SPEED;
    const moving = mx !== 0 || my !== 0;
    if (sprint && moving && p.stamina > 0) { speed *= SPRINT_MULT; p.stamina -= dt; }
    else p.stamina = Math.min(STAMINA_MAX, p.stamina + dt * 0.5);
    if (inBush(p)) speed *= 0.8;
    p.vx = mx * speed; p.vy = my * speed;
    p.x += p.vx * dt; p.y += p.vy * dt;
    const blocked = resolveCollisions(p);
    if (blocked && p.isBot && !p.target) p.wanderA += Math.PI * rand(0.5, 1.5);
    if (blocked && p.isBot && p.target) p.strafe *= -1;
  }

  function update(dt) {
    for (const p of players) {
      if (!p.alive) {
        p.respawn -= dt;
        if (p.respawn <= 0 && (p.isBot || autoRespawn)) spawn(p);
        continue;
      }
      p.cooldown -= dt;
      p.shield = Math.max(0, p.shield - dt);
      p.hitFlash = Math.max(0, p.hitFlash - dt);
      if (p.reload > 0) { p.reload -= dt; if (p.reload <= 0) { p.reload = 0; p.ammo = MAG_SIZE; } }

      if (p === me) {
        let mx = (keys.KeyD || keys.ArrowRight ? 1 : 0) - (keys.KeyA || keys.ArrowLeft ? 1 : 0);
        let my = (keys.KeyS || keys.ArrowDown ? 1 : 0) - (keys.KeyW || keys.ArrowUp ? 1 : 0);
        const l = Math.hypot(mx, my) || 1;
        p.aim = Math.atan2(mouseY - H / 2, mouseX - W / 2);
        movePlayer(p, mx / l, my / l, keys.ShiftLeft || keys.ShiftRight, dt);
        if (mouseDown) shoot(p);
      } else {
        const m = botThink(p, dt);
        movePlayer(p, m.mx, m.my, m.sprint, dt);
      }
    }

    // Player-player separation
    for (let i = 0; i < players.length; i++) for (let j = i + 1; j < players.length; j++) {
      const a = players[i], b = players[j];
      if (!a.alive || !b.alive) continue;
      const dx = b.x - a.x, dy = b.y - a.y, d = Math.hypot(dx, dy);
      if (d > 0 && d < PLAYER_R * 2) {
        const push = (PLAYER_R * 2 - d) / 2;
        a.x -= dx / d * push; a.y -= dy / d * push;
        b.x += dx / d * push; b.y += dy / d * push;
      }
    }

    // Paintballs
    for (let i = balls.length - 1; i >= 0; i--) {
      const bl = balls[i];
      const ox = bl.x, oy = bl.y;
      bl.x += bl.vx * dt; bl.y += bl.vy * dt;
      bl.life -= dt;
      let dead = false;
      if (!lineOfSight(ox, oy, bl.x, bl.y) || bl.x < 0 || bl.y < 0 || bl.x > WORLD || bl.y > WORLD) {
        // Binary search back along the step for the impact point
        const ex = bl.x, ey = bl.y;
        let lo = 0, hi = 1;
        for (let s = 0; s < 6; s++) {
          const mid = (lo + hi) / 2;
          if (lineOfSight(ox, oy, ox + (ex - ox) * mid, oy + (ey - oy) * mid)) lo = mid; else hi = mid;
        }
        bl.x = ox + (ex - ox) * lo; bl.y = oy + (ey - oy) * lo;
        splat(bl.x, bl.y, bl.color, 8);
        burst(bl.x, bl.y, bl.color, 5, 120);
        dead = true;
      } else {
        for (const p of players) {
          if (!p.alive || p === bl.owner) continue;
          if (segCircle(ox, oy, bl.x, bl.y, p.x, p.y, PLAYER_R + BALL_R)) {
            hitPlayer(p, bl);
            dead = true; break;
          }
        }
      }
      if (!dead && bl.life <= 0) { splat(bl.x, bl.y, bl.color, 6); dead = true; }
      if (dead) balls.splice(i, 1);
    }

    for (let i = particles.length - 1; i >= 0; i--) {
      const q = particles[i];
      q.x += q.vx * dt; q.y += q.vy * dt; q.vx *= 0.9; q.vy *= 0.9; q.life -= dt;
      if (q.life <= 0) particles.splice(i, 1);
    }
    for (let i = feed.length - 1; i >= 0; i--) { feed[i].t -= dt; if (feed[i].t <= 0) feed.splice(i, 1); }
  }

  // ---------- Render ----------
  let camX = 0, camY = 0;

  function drawPlayer(p) {
    const hidden = inBush(p);
    if (hidden && p !== me) {
      // Others in bushes are only visible when you're close
      if (!me.alive || dist2(me.x, me.y, p.x, p.y) > 110 * 110) return;
    }
    ctx.save();
    ctx.translate(p.x, p.y);
    if (hidden) ctx.globalAlpha = 0.55;
    if (p.shield > 0 && Math.floor(p.shield * 10) % 2 === 0) ctx.globalAlpha *= 0.4;

    // Gun
    ctx.save();
    ctx.rotate(p.aim);
    ctx.fillStyle = '#333';
    ctx.fillRect(PLAYER_R - 6, -5, 22, 10);
    ctx.fillStyle = p.color;
    ctx.beginPath(); ctx.arc(PLAYER_R - 2, -8, 6, 0, Math.PI * 2); ctx.fill(); // hopper
    ctx.restore();

    // Body
    ctx.beginPath(); ctx.arc(0, 0, PLAYER_R, 0, Math.PI * 2);
    ctx.fillStyle = p.hitFlash > 0 ? '#fff' : p.color; ctx.fill();
    ctx.lineWidth = 3; ctx.strokeStyle = 'rgba(0,0,0,.35)'; ctx.stroke();
    // Goggles
    ctx.save(); ctx.rotate(p.aim);
    ctx.fillStyle = '#222';
    ctx.fillRect(4, -10, 9, 20);
    ctx.fillStyle = 'rgba(120,200,255,.8)';
    ctx.fillRect(6, -8, 5, 16);
    ctx.restore();

    if (p.shield > 0) {
      ctx.globalAlpha = 0.6;
      ctx.beginPath(); ctx.arc(0, 0, PLAYER_R + 7, 0, Math.PI * 2);
      ctx.strokeStyle = '#fff'; ctx.lineWidth = 2; ctx.stroke();
    }
    ctx.restore();

    // Name + HP pips
    ctx.save();
    ctx.globalAlpha = hidden ? 0.6 : 1;
    ctx.font = 'bold 13px system-ui'; ctx.textAlign = 'center';
    ctx.lineWidth = 3; ctx.strokeStyle = 'rgba(0,0,0,.6)'; ctx.fillStyle = '#fff';
    ctx.strokeText(p.name, p.x, p.y - PLAYER_R - 16);
    ctx.fillText(p.name, p.x, p.y - PLAYER_R - 16);
    for (let i = 0; i < MAX_HP; i++) {
      ctx.fillStyle = i < p.hp ? '#ff4d6d' : 'rgba(0,0,0,.35)';
      ctx.beginPath(); ctx.arc(p.x + (i - (MAX_HP - 1) / 2) * 11, p.y - PLAYER_R - 6, 4, 0, Math.PI * 2); ctx.fill();
    }
    ctx.restore();
  }

  function render() {
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
    if (me) {
      const tx = me.x - W / 2, ty = me.y - H / 2;
      camX += (tx - camX) * 0.2; camY += (ty - camY) * 0.2;
    }
    ctx.fillStyle = '#152017'; ctx.fillRect(0, 0, W, H);
    ctx.save();
    ctx.translate(-Math.round(camX), -Math.round(camY));

    // Ground + grid
    ctx.fillStyle = '#5f9a55'; ctx.fillRect(0, 0, WORLD, WORLD);
    ctx.strokeStyle = 'rgba(0,0,0,.07)'; ctx.lineWidth = 1;
    ctx.beginPath();
    for (let g = 0; g <= WORLD; g += 80) { ctx.moveTo(g, 0); ctx.lineTo(g, WORLD); ctx.moveTo(0, g); ctx.lineTo(WORLD, g); }
    ctx.stroke();
    ctx.drawImage(paint, 0, 0, WORLD, WORLD);
    ctx.strokeStyle = '#2b4427'; ctx.lineWidth = 8; ctx.strokeRect(-4, -4, WORLD + 8, WORLD + 8);

    // Obstacles (shadow, then body)
    for (const r of rects) {
      ctx.fillStyle = 'rgba(0,0,0,.25)'; ctx.fillRect(r.x + 6, r.y + 6, r.w, r.h);
    }
    for (const o of rocks) {
      ctx.fillStyle = 'rgba(0,0,0,.25)'; ctx.beginPath(); ctx.arc(o.x + 6, o.y + 6, o.r, 0, Math.PI * 2); ctx.fill();
    }
    for (const r of rects) {
      if (r.kind === 'crate') {
        ctx.fillStyle = '#b07b3e'; ctx.fillRect(r.x, r.y, r.w, r.h);
        ctx.strokeStyle = '#7a5226'; ctx.lineWidth = 4; ctx.strokeRect(r.x + 2, r.y + 2, r.w - 4, r.h - 4);
        ctx.beginPath(); ctx.moveTo(r.x + 4, r.y + 4); ctx.lineTo(r.x + r.w - 4, r.y + r.h - 4);
        ctx.moveTo(r.x + r.w - 4, r.y + 4); ctx.lineTo(r.x + 4, r.y + r.h - 4); ctx.stroke();
      } else {
        ctx.fillStyle = '#8c8f99'; ctx.fillRect(r.x, r.y, r.w, r.h);
        ctx.fillStyle = '#a9adb8'; ctx.fillRect(r.x, r.y, r.w, Math.min(6, r.h));
      }
    }
    for (const o of rocks) {
      ctx.fillStyle = '#7d7f86'; ctx.beginPath(); ctx.arc(o.x, o.y, o.r, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = '#9a9ca4'; ctx.beginPath(); ctx.arc(o.x - o.r * 0.25, o.y - o.r * 0.25, o.r * 0.55, 0, Math.PI * 2); ctx.fill();
    }

    // Paintballs
    for (const b of balls) {
      ctx.fillStyle = b.color; ctx.beginPath(); ctx.arc(b.x, b.y, BALL_R, 0, Math.PI * 2); ctx.fill();
      ctx.strokeStyle = 'rgba(0,0,0,.4)'; ctx.lineWidth = 1.5; ctx.stroke();
    }

    for (const p of players) if (p.alive) drawPlayer(p);

    // Bushes drawn on top so players hide in them
    for (const b of bushes) {
      ctx.fillStyle = 'rgba(40, 110, 45, 0.88)';
      ctx.beginPath(); ctx.arc(b.x, b.y, b.r, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = 'rgba(70, 150, 70, 0.9)';
      for (let k = 0; k < 5; k++) {
        const a = k * 1.256 + b.r;
        ctx.beginPath(); ctx.arc(b.x + Math.cos(a) * b.r * 0.45, b.y + Math.sin(a) * b.r * 0.45, b.r * 0.42, 0, Math.PI * 2); ctx.fill();
      }
    }

    for (const q of particles) {
      ctx.globalAlpha = clamp(q.life * 2.5, 0, 1);
      ctx.fillStyle = q.color; ctx.beginPath(); ctx.arc(q.x, q.y, q.r, 0, Math.PI * 2); ctx.fill();
    }
    ctx.globalAlpha = 1;
    ctx.restore();

    if (me) drawHUD();
  }

  function drawHUD() {
    // Leaderboard
    const sorted = [...players].sort((a, b) => b.kills - a.kills || a.deaths - b.deaths);
    const lbW = 190, rowH = 20, top = 5;
    ctx.fillStyle = 'rgba(0,0,0,.45)';
    ctx.fillRect(W - lbW - 12, 12, lbW, 30 + rowH * Math.min(top, sorted.length) + (sorted.indexOf(me) >= top ? rowH : 0));
    ctx.font = 'bold 14px system-ui'; ctx.textAlign = 'left'; ctx.fillStyle = '#fff';
    ctx.fillText('Leaderboard', W - lbW, 32);
    ctx.font = '13px system-ui';
    const rows = sorted.slice(0, top);
    const myRank = sorted.indexOf(me);
    if (myRank >= top) rows.push(me);
    rows.forEach((p, i) => {
      const rank = sorted.indexOf(p) + 1;
      const y = 54 + i * rowH;
      ctx.fillStyle = p === me ? '#ffe066' : '#fff';
      ctx.textAlign = 'left';
      ctx.fillText(`${rank}. ${p.name}`, W - lbW, y);
      ctx.fillStyle = p.color; ctx.fillRect(W - lbW - 8, y - 9, 4, 10);
      ctx.fillStyle = p === me ? '#ffe066' : '#fff';
      ctx.textAlign = 'right';
      ctx.fillText(p.kills, W - 22, y);
    });

    // Kill feed
    ctx.textAlign = 'left'; ctx.font = 'bold 14px system-ui';
    feed.forEach((f, i) => {
      ctx.globalAlpha = clamp(f.t, 0, 1);
      ctx.fillStyle = 'rgba(0,0,0,.45)';
      const w = ctx.measureText(f.msg).width + 16;
      ctx.fillRect(12, 12 + i * 26, w, 22);
      ctx.fillStyle = f.mine ? '#ffe066' : '#fff';
      ctx.fillText(f.msg, 20, 28 + i * 26);
    });
    ctx.globalAlpha = 1;

    // Ammo / HP / stamina (bottom center)
    if (me.alive) {
      const cx = W / 2, by = H - 30;
      ctx.textAlign = 'center';
      for (let i = 0; i < MAG_SIZE; i++) {
        ctx.fillStyle = i < me.ammo ? me.color : 'rgba(0,0,0,.4)';
        ctx.beginPath(); ctx.arc(cx + (i - (MAG_SIZE - 1) / 2) * 16, by, 6, 0, Math.PI * 2); ctx.fill();
      }
      if (me.reload > 0) {
        const w = 200, pr = 1 - me.reload / RELOAD_TIME;
        ctx.fillStyle = 'rgba(0,0,0,.5)'; ctx.fillRect(cx - w / 2, by - 30, w, 10);
        ctx.fillStyle = '#fff'; ctx.fillRect(cx - w / 2, by - 30, w * pr, 10);
        ctx.font = 'bold 13px system-ui'; ctx.fillText('RELOADING', cx, by - 36);
      }
      // Stamina bar
      const sw = 120;
      ctx.fillStyle = 'rgba(0,0,0,.4)'; ctx.fillRect(cx - sw / 2, by + 12, sw, 5);
      ctx.fillStyle = '#7fd4ff'; ctx.fillRect(cx - sw / 2, by + 12, sw * me.stamina / STAMINA_MAX, 5);
    }

    // Minimap
    const mm = 150, mx0 = 12, my0 = H - mm - 12, s = mm / WORLD;
    ctx.fillStyle = 'rgba(0,0,0,.45)'; ctx.fillRect(mx0, my0, mm, mm);
    ctx.fillStyle = 'rgba(200,200,210,.6)';
    for (const r of rects) ctx.fillRect(mx0 + r.x * s, my0 + r.y * s, Math.max(1, r.w * s), Math.max(1, r.h * s));
    for (const o of rocks) { ctx.beginPath(); ctx.arc(mx0 + o.x * s, my0 + o.y * s, o.r * s, 0, Math.PI * 2); ctx.fill(); }
    if (me.alive) {
      ctx.fillStyle = me.color; ctx.strokeStyle = '#fff'; ctx.lineWidth = 2;
      ctx.beginPath(); ctx.arc(mx0 + me.x * s, my0 + me.y * s, 4, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
    }

    // Stats
    ctx.textAlign = 'right'; ctx.font = 'bold 14px system-ui'; ctx.fillStyle = '#fff';
    ctx.fillText(`Splats: ${me.kills}   Deaths: ${me.deaths}`, W - 14, H - 16);

    // Death screen
    if (!me.alive) {
      ctx.fillStyle = 'rgba(0,0,0,.45)'; ctx.fillRect(0, 0, W, H);
      ctx.textAlign = 'center'; ctx.fillStyle = '#fff';
      ctx.font = 'bold 44px system-ui'; ctx.fillText('SPLATTED!', W / 2, H / 2 - 20);
      ctx.font = '20px system-ui';
      if (me.respawn > 0) ctx.fillText(`Respawning in ${Math.ceil(me.respawn)}...`, W / 2, H / 2 + 20);
    }
  }

  // ---------- Game loop / menu ----------
  const autoRespawn = true;
  let running = false;
  let last = performance.now();
  function frame(now) {
    const dt = Math.min(0.05, (now - last) / 1000);
    last = now;
    if (running) update(dt);
    render();
    requestAnimationFrame(frame);
  }

  const colorsEl = document.getElementById('colors');
  let chosen = COLORS[0];
  COLORS.forEach((c, i) => {
    const b = document.createElement('button');
    b.style.background = c;
    if (i === 0) b.classList.add('sel');
    b.onclick = () => { chosen = c; colorsEl.querySelectorAll('button').forEach(x => x.classList.remove('sel')); b.classList.add('sel'); };
    colorsEl.appendChild(b);
  });

  function startGame() {
    const name = document.getElementById('name').value.trim() || 'You';
    buildMap();
    pctx.clearRect(0, 0, paint.width, paint.height);
    players = []; balls = []; particles = []; feed = [];
    me = makePlayer(name, chosen, false);
    players.push(me);
    const botColors = COLORS.filter(c => c !== chosen);
    const names = [...BOT_NAMES].sort(() => Math.random() - 0.5);
    for (let i = 0; i < NUM_BOTS; i++) players.push(makePlayer(names[i], botColors[i % botColors.length], true));
    for (const p of players) spawn(p);
    camX = me.x - W / 2; camY = me.y - H / 2;
    document.getElementById('menu').style.display = 'none';
    running = true;
  }
  document.getElementById('play').onclick = startGame;
  document.getElementById('name').addEventListener('keydown', e => { if (e.key === 'Enter') startGame(); });

  // Idle background behind the menu
  buildMap();
  camX = WORLD / 2 - W / 2; camY = WORLD / 2 - H / 2;
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
